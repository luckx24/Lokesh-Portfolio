apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-simple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
      - name: portfolio
        image: 267418657844.dkr.ecr.ap-south-1.amazonaws.com/portfolio-app:latest
        resources:
          requests:
            cpu: "5m"      # MINIMUM!
            memory: "8Mi"  # MINIMUM!
          limits:
            cpu: "20m"
            memory: "32Mi"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: portfolio
